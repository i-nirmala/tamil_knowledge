<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:transparent;color:#4a3328}
.wrap{display:flex;align-items:center;gap:10px;width:100%}.voice{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;border:1px solid #d9c7e0;border-radius:14px;background:linear-gradient(135deg,#fffdfb,#f4eaf7);color:#604234;font-weight:700;cursor:pointer;box-shadow:0 7px 20px rgba(91,64,52,.08);transition:.2s}
.voice:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(111,77,127,.16)}.orb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6b4637,#8b6aa8);color:#fff;position:relative}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;inset:-5px;border:1px solid rgba(139,106,168,.35);animation:pulse 2s infinite}.orb:after{inset:-10px;animation-delay:.5s}.listening .orb{animation:breathe .9s infinite}.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#8b6aa8;opacity:0;animation:spark 1.8s infinite}.s1{left:20%;top:15%}.s2{right:18%;top:24%;animation-delay:.4s}.s3{right:25%;bottom:14%;animation-delay:.8s}.status{font-size:12px;opacity:.78}.result{font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.2}50%{transform:scale(1.08);opacity:.8}}@keyframes breathe{50%{transform:scale(1.08)}}@keyframes spark{0%,100%{transform:translateY(0) scale(.5);opacity:0}40%{opacity:1}80%{transform:translateY(-8px) scale(1);opacity:0}}
</style></head><body><div class="wrap"><button class="voice" id="voice"><span class="orb">✦</span><span id="label">🎙 Voice question</span><span class="status" id="status">Tamil · English · Tanglish</span><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></button></div>
<script>
let lang='ta-IN';
function send(type,data){window.parent.postMessage({isStreamlitMessage:true,type,data},'*')}
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:54});window.addEventListener('message',e=>{const m=e.data;if(m&&m.type==='streamlit:render'&&m.args&&m.args.language){lang=m.args.language;}});
const btn=document.getElementById('voice'),label=document.getElementById('label'),status=document.getElementById('status');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
if(!SR){label.textContent='🎙 Voice unavailable';status.textContent='Use Chrome / Edge';}
btn.onclick=()=>{
 if(!SR)return;if(rec){try{rec.stop()}catch(e){}return}
 rec=new SR();rec.lang=lang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
 btn.classList.add('listening');label.textContent='Listening…';status.textContent='Speak your question';
 rec.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;}if(final){status.textContent=final;send('streamlit:setComponentValue',final)}};
 rec.onerror=e=>{status.textContent=e.error==='not-allowed'?'Microphone permission blocked':'Try again';label.textContent='🎙 Voice question';btn.classList.remove('listening');rec=null};
 rec.onend=()=>{btn.classList.remove('listening');label.textContent='🎙 Voice question';if(!status.textContent||status.textContent==='Speak your question')status.textContent='Tamil · English · Tanglish';rec=null};
 try{rec.start()}catch(e){}
};
</script></body></html>
